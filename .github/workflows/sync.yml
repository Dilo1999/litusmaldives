
name: Sync Personal Repo to LITUS Group

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'Dilo1999/litusmaldives'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Personal Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to LITUS Organization
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        run: |
          if [ -z "$ORG_SYNC_TOKEN" ]; then
            echo "ORG_SYNC_TOKEN is missing"
            exit 1
          fi

          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ORG_SYNC_TOKEN" | base64 -w0)" \
            push https://github.com/LITUS-Group/my-project.git \
            HEAD:refs/heads/main
